services:
  postgres:
    image: postgres:16
    container_name: tito-postgres
    restart: unless-stopped
    network_mode: host

    environment:
      POSTGRES_USER: tito
      POSTGRES_PASSWORD: tito_password
      POSTGRES_DB: tito

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: tito-backend
    restart: unless-stopped
    network_mode: host

    environment:
      DATABASE_URL: postgresql://tito:tito_password@127.0.0.1:5432/tito
      PORT: 4000
      NODE_ENV: production

volumes:
  postgres_data:
