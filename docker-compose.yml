services:

  database:
    image: postgres:16
    container_name: tito_database
    restart: unless-stopped

    environment:
      POSTGRES_USER: tito
      POSTGRES_PASSWORD: tito_password
      POSTGRES_DB: tito

    ports:
      - "5432:5432"

    volumes:
      - tito_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  storage:
    image: quay.io/minio/minio:latest
    container_name: tito_storage
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: tito_admin
      MINIO_ROOT_PASSWORD: tito_storage_password

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - tito_storage_data:/data


  backend:
    build:
      context: ./backend

    container_name: tito_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5000:5000"

    depends_on:
      - database
      - storage


volumes:

  tito_postgres_data:

  tito_storage_data:
