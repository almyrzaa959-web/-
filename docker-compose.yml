services:
  postgres:
    image: postgres:16
    container_name: tito-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: tito
      POSTGRES_PASSWORD: tito_password
      POSTGRES_DB: tito

    ports:
      - "5432:5432"
      - "4000:4000"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tito -d tito"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: tito-backend
    restart: unless-stopped

    network_mode: "service:postgres"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://tito:tito_password@127.0.0.1:5432/tito
      PORT: 4000
      NODE_ENV: production

volumes:
  postgres_data:
